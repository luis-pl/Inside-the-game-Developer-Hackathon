[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "inside-the-game-developer-hackathon"
version = "0.0.0"
description = "API de consultas deportivas predeterminadas sobre Azure SQL."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.161,<0.162", "uvicorn>=0.54,<0.55", "pydantic>=2.14,<3",
  "mssql-python>=1.16,<1.17", "azure-identity>=1.26,<2",
  "numpy>=2.5,<3", "scipy>=1.18,<2", "networkx>=3.7,<4",
  "shapely>=2.2,<3", "gudhi>=3.13,<4",
  "mcp>=2.3,<2.4", "httpx>=0.28,<1",
  "httpx2>=2.16,<3",
  "a2a-sdk[http-server]>=1.2.3,<1.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "httpx>=0.28,<1", "ruff>=0.17,<1"]

[project.scripts]
inside-game-api = "inside_game.cli:main"
inside-game-mcp = "inside_game.mcp_server:main"
inside-game-data-agent = "inside_game.data_agent_cli:main"
inside-game-insights = "inside_game.insights.__main__:main"
inside-game-insights-mcp = "inside_game.insights.mcp_server:main"
inside-game-agents = "inside_game.agents_cli:main"
inside-game-workspace = "inside_game.workspace:main"
inside-game-insights-agent = "inside_game.agents.insights_agent.__main__:main"
inside-game-data-agent-a2a = "inside_game.a2a_agents.data_server:main"
inside-game-insights-agent-a2a = "inside_game.a2a_agents.insights_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inside_game = ["sql/*.sql", "insights/catalog.json", "agents/insights_agent/source_profiles.json", "locales/*.json"]

[tool.setuptools.data-files]
"share/inside-game/prompts" = ["prompts/data_agent.md", "prompts/insights_planner.md", "prompts/insights_agent.md", "prompts/sports_analyst.md", "prompts/interpreter.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
